name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.24.x"
  VERSION_PACKAGE: "github.com/NiHaiden/nginx-proxy-manager-cli/internal/npmctl"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Verify release tag matches VERSION
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version="$(cat VERSION)"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match VERSION $version. Expected v$version."
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Read build metadata
        id: metadata
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w -X ${VERSION_PACKAGE}.Version=${VERSION} -X ${VERSION_PACKAGE}.Commit=${GITHUB_SHA} -X ${VERSION_PACKAGE}.BuildDate=${BUILD_DATE}" \
            -o "dist/npmctl-${GOOS}-${GOARCH}" \
            ./cmd/npmctl

      - name: Package binary
        run: |
          cd dist
          shasum -a 256 "npmctl-${{ matrix.goos }}-${{ matrix.goarch }}" > "npmctl-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"
          tar -czf "npmctl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            "npmctl-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "npmctl-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: npmctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/npmctl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/npmctl-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
